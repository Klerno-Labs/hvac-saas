name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fieldclose
          POSTGRES_PASSWORD: fieldclose_ci_only
          POSTGRES_DB: fieldclose_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldclose -d fieldclose_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://fieldclose:fieldclose_ci_only@localhost:5432/fieldclose_test
    defaults:
      run:
        working-directory: app-scaffold/hvac-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: app-scaffold/hvac-app/package-lock.json

      - name: Validate OVH production deployment guards
        run: node --test deploy/ovh/production/safety.test.mjs
        working-directory: .

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          AUTH_SECRET: "ci-secret-not-real"
          SKIP_ENV_VALIDATION: "true"

      - run: npm test -- --run --reporter=verbose
        if: hashFiles('app-scaffold/hvac-app/vitest.config.*') != ''

      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://fieldclose:fieldclose_ci_only@localhost:5432/fieldclose_test

      - run: npm audit --omit=dev --audit-level=high

      - name: Validate production-only startup
        run: |
          npm prune --omit=dev --ignore-scripts
          node scripts/smoke-production-runtime.cjs
        env:
          AUTH_SECRET: "ci-secret-not-real"
          AUTH_URL: "http://127.0.0.1:3217"
          APP_URL: "http://127.0.0.1:3217"
          AUTH_TRUST_HOST: "true"
          DEPLOYMENT_ENV: "preview"
          SCHEDULED_TASKS_ENABLED: "false"
