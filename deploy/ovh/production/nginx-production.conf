# Activate only after the apex/www certificate and loopback production service
# have passed verification. Leave the existing staging/default site unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name fieldclose.app www.fieldclose.app;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fieldclose-acme;
        auth_basic off;
        try_files $uri =404;
    }
    location / {
        return 308 https://fieldclose.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fieldclose.app;
    ssl_certificate /etc/letsencrypt/live/fieldclose.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldclose.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    return 308 https://fieldclose.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fieldclose.app;
    ssl_certificate /etc/letsencrypt/live/fieldclose.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldclose.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Requests can contain portal/reset tokens in their paths or query strings.
    # Keep request/error URL logs disabled; app diagnostics are privacy filtered.
    access_log off;
    error_log /dev/null;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host fieldclose.app;
        proxy_set_header X-Forwarded-Host fieldclose.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Preserve Authorization: production cron/API authentication requires it.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
